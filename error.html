<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8" />
    <title>Therefore™</title>
    <style type="text/css">
        html,
        body,
        form {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #FFF;
            font: 12px 'Avant Grade Gothic book', 'Lucida Sans Unicode', 'Lucida Grande', Verdana, Arial, Helvetica, sans-serif;
        }

        img {
            border: none;
        }

        .tblError {
            width: 100%;
        }

        .tdErrorHeader {
            background: #2B579A;
        }

        .tdErrLbl,
        .tdErrAnonymousAuthentication {
            width: 800px;
        }

        .tdErrLbl {
            color: #FF0000;
            padding-top: 50px;
            font-weight: bold;
        }

        .tdErrAnonymousAuthentication {
            color: #464646;
            min-height: 700px;
        }

        a:link,
        a:visited,
        a:active,
        a:hover {
            color: #0a3cff;
            white-space: nowrap;
            text-decoration: underline;
        }

        a:hover {
            text-decoration: none;
        }
    </style>
    <script type="text/javascript">
        function pageLoad() {
            var error = get_valueQueryString('t', window.top.document.location.href);
            var errAnonymousAuthentication = document.getElementById('errAnonymousAuthentication');

            if (errAnonymousAuthentication && error == 'auth') {
                errAnonymousAuthentication.innerHTML = 'Please contact your server administrator because the Anonymous Authentication is denied on the server.<br />' +
                    'To allow the anonymousAuthentication, please open the applicationHost.config file for editing (with administrator rights):<br />' +
                    '“<i>“%windir%\\system32\\inetsrv\\config\\applicationHost.config</i>“ and change the Deny to Allow:<br /><br />' +
                    '<b>&#60;section name=\"anonymousAuthentication\" overrideModeDefault=\"Allow\" /&#62;</b>';
            }
        }

        function get_valueQueryString (name, url) {
            name = name.replace(/[\[\]]/g, '\\$&');

            var regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)');
            var result = regex.exec(url);
            if (result && result[2])
                return result[2];

            return '';
        }
    </script>
</head>

<body onload="pageLoad()">

    <table cellspacing="0" cellpadding="25" class="tblError">
    	<tr>
    		<td class="tdErrorHeader">
                <img src="./Error/errorLOGO.png" height="38" alt="" />
            </td>
    	</tr>
    	<tr>
    		<td class="tdErrLbl">
                An error occurred while trying to access Therefore™ website.
            </td>
    	</tr>
    	<tr>
    		<td class="tdErrAnonymousAuthentication">
                <p id="errAnonymousAuthentication">&nbsp;</p>
            </td>
    	</tr>
    	<tr>
    		<td>
                <a href="javascript:window.history.back()">Back</a>
            </td>
    	</tr>
    </table>

</body>

</html>
